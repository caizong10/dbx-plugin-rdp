name: Plugin release

# Builds the unsigned candidate .dbxp for every supported native target and
# attaches them to a GitHub Release. DBX installs these as "unsigned
# development packages" (Plugin Center → allow unsigned dev packages); the
# official Marketplace listing is a separate, maintainer-signed flow via
# t8y2/dbx-store.
#
# This matrix is also the cross-platform verification: every target runs the
# Rust and frontend test suites on its own real OS before packaging.
#
# Tag a version to publish:  git tag v0.2.3 && git push origin v0.2.3

on:
  push:
    # Branch pushes run the build + test matrix only; the release job is
    # guarded by the tag check below. This keeps every platform continuously
    # verified instead of only at release time.
    branches:
      - main
      - file-clipboard
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          # macos-15-intel is GitHub's current Intel runner label; the older
          # macos-13 image is being retired and its jobs can sit queued
          # indefinitely. macos-14 is Apple Silicon.
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test UI
        run: |
          npm run typecheck
          npm test

      - name: Test backend
        working-directory: backend
        run: cargo test --release

      - name: Build UI
        run: npm run build

      - name: Sync manifest to release version
        shell: bash
        run: |
          # A tag build must ship the tag's version in the manifest, otherwise
          # the store rejects the candidate on identity mismatch.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            node -e '
              const fs = require("node:fs");
              const version = process.argv[1];
              for (const file of ["manifest.json", "backend/Cargo.toml"]) {
                let text = fs.readFileSync(file, "utf8");
                text = file.endsWith(".json")
                  ? text.replace(/("version":\s*")[^"]+(")/, `$1${version}$2`)
                  : text.replace(/^version = "[^"]+"/m, `version = "${version}"`);
                fs.writeFileSync(file, text);
              }
            ' "$version"
          fi

      # `dbx-plugin package` builds the sidecar for the host target, stages it
      # under bin/<target>/ and rewrites the packaged manifest's executable
      # path accordingly — no manual copying needed.
      - name: Install DBX plugin CLI
        shell: bash
        run: |
          cli_version="$(npm view @dbx-app/plugin-cli version)"
          npm install --no-save --no-audit --no-fund "@dbx-app/plugin-cli@${cli_version}"
          echo "DBX_PLUGIN_SDK_ROOT=$GITHUB_WORKSPACE/node_modules/@dbx-app/plugin-cli/sdk-root" >> "$GITHUB_ENV"

      - name: Refresh Cargo.lock for packaging
        run: node scripts/relock-for-package.mjs

      - name: Package .dbxp
        run: npx --no-install dbx-plugin package .

      - name: Verify package
        shell: bash
        run: |
          # Node-only so this works identically on Windows, Linux and macOS.
          # A package without the native sidecar would be far below 1 MB, so
          # the size assertion catches a silently missing executable.
          node -e '
            const fs = require("node:fs");
            const files = fs.readdirSync("dist").filter((f) => f.endsWith(".dbxp"));
            if (files.length !== 1) throw new Error(`expected 1 .dbxp, got ${files.length}`);
            const file = files[0];
            const size = fs.statSync(`dist/${file}`).size;
            const meta = JSON.parse(
              fs.readFileSync(`dist/${file.replace(/\.dbxp$/, ".artifact.json")}`, "utf8"),
            );
            console.log("package:", file);
            console.log("size:", size, "sha256:", meta.sha256);
            if (!file.includes(process.env.TARGET)) {
              throw new Error(`package name does not mention target ${process.env.TARGET}`);
            }
            if (size < 1_000_000) {
              throw new Error(`package is ${size} bytes; the native sidecar is probably missing`);
            }
          '
        env:
          TARGET: ${{ matrix.target }}

      - name: Verify sidecar identity
        run: python scripts/smoke-package.py ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbxp-${{ matrix.target }}
          path: dist/*.dbxp
          if-no-files-found: error

  release:
    name: Attach packages to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dbxp
          generate_release_notes: true
          fail_on_unmatched_files: true
